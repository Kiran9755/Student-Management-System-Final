<!DOCTYPE html>

<html lang="en">
<head>
<title>Add Subject</title>
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"/>
<link href="{{ url_for('static', filename='images/icon.png') }}" rel="icon" type="image/png"/>
</head>
<body>
<div class="admin_navbar global_role_navbar"><div class="admin_nav_left"><h1>Student Management System</h1></div><div class="admin_nav_right global_nav_right"><a class="global_home_link" href="/admin_dashboard">Home</a><div class="global_nav_dropdown"><button class="global_nav_dropdown_button" type="button">Menu ▾</button><div class="global_nav_dropdown_menu"><a href="/admin_students">Students</a><a href="/admin_teachers">Teachers</a><a href="/admin_subjects">Subjects</a><a href="/admin_enrollment">Enrollment</a><a href="/admin_teacher_subjects">Teacher Subjects</a><a href="/admin_departments">Departments</a><a href="/admin_hods">HODs</a><a href="/logout?role=admin">Logout</a></div></div></div></div>
<div class="admin_add_subject_container">
<div class="admin_add_subject_card">
<h1>Add Subject</h1>
<p>Create a new subject</p>


            {% with messages = get_flashed_messages() %}

            {% if messages %}

            {% for message in messages %}

            <p class="admin_add_subject_error">
                {{ message }}
            </p>

            {% endfor %}

            {% endif %}

            {% endwith %}


            <form action="/admin_add_subject" method="POST">
<label>Subject ID</label>
<input name="subject_id" placeholder="Enter Subject ID" required="" type="text"/>
<label>Subject Name</label>
<input name="subject_name" placeholder="Enter Subject Name" required="" type="text"/>
<label>Department</label>
<select name="department" required="">
<option value="">
                        Select Department
                    </option>

                    {% for department in departments %}

                    <option value="{{ department['department_name'] }}">
                        {{ department['department_name'] }}
                    </option>

                    {% endfor %}

                </select>
<label>Semester</label>
<input max="8" min="1" name="semester" placeholder="Enter Semester" required="" type="number"/>
<label>Subject Type</label>
<select name="subject_type" required="">
<option value="">
                        Select Subject Type
                    </option>
<option value="Theory">
                        Theory
                    </option>
<option value="Practical">
                        Practical
                    </option>
</select>
<button type="submit">
                    Add Subject
                </button>
</form>
<a href="/admin_subjects">
<button type="button">
                    Back to Subjects
                </button>
</a>
</div>
</div>
<script src="{{ url_for('static', filename='js/common.js') }}" defer></script>
</body>
</html>
