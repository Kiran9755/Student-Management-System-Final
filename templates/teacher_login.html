<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icon.png') }}">

</head>


<body class="login-page">


    <div class="login_background">


        <!-- ================= LOGIN CARD ================= -->

        <div class="login_card">


            <div class="login_header">

                <div class="login_icon">
                    T
                </div>

                <h1>
                    Teacher Login
                </h1>

                <p>
                    Access your teaching dashboard
                </p>

            </div>


            <!-- ================= LOGIN FORM ================= -->

            <form action="/teacher_login" method="post" class="login_form">


                <div class="input_group">

                    <label for="teacher_id">
                        Teacher ID
                    </label>

                    <input type="text" id="teacher_id" name="teacher_id" placeholder="Enter your teacher ID" required>

                </div>


                <div class="input_group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" placeholder="Enter your password" required>

                </div>


                <button type="submit" class="login_button">

                    Login

                </button>


            </form>
            {% with messages = get_flashed_messages() %}

            {% if messages %}

            {% for message in messages %}

            <p class="login_error">
                {{ message }}
            </p>

            {% endfor %}

            {% endif %}

            {% endwith %}

            <!-- ================= FOOTER LINKS ================= -->

            <div class="login_footer">

                <a href="/">
                    ← Back to Home
                </a>

                <a href="/student_login">
                    Student Login
                </a>

            </div>


        </div>

    </div>


<script src="{{ url_for('static', filename='js/common.js') }}" defer></script>
</body>

</html>
